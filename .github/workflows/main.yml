name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Draw app icon + splash
        run: npm run assets
        continue-on-error: true

      - name: Create Android project
        run: npx cap add android

      - name: Apply icon + splash
        run: npx capacitor-assets generate --android --iconBackgroundColor "#070312" --iconBackgroundColorDark "#070312" --splashBackgroundColor "#070312" --splashBackgroundColorDark "#070312"
        continue-on-error: true

      - name: Lock portrait orientation
        run: sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml
        continue-on-error: true

      - name: Sync game into the app
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulsarDrift-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
